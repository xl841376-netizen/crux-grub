# crux GRUB 条目（改这个文件就行，不用重做 .efi）
set timeout=5
set default=0

# ---- 7.3 日志分流版（crux-te 只在异常时打印）----
menuentry "crux Linux (mainline 7.3, te-log-quiet)" --id crux73te {
	search --no-floppy --file --set=root /EFI/crux/Image74
	set crux_replay=2
	insmod ($root)/EFI/crux/cruxdisplay.mod

	crux_display_init ($root)/EFI/crux/sm8150-xiaomi-crux-73.dtb
	linux	($root)/EFI/crux/Image74 rw cfg80211.ieee80211_regdom=CN clk_ignore_unused pd_ignore_unused deferred_probe_timeout=-1 printk.time=1 root=UUID=ed36cd26-63e2-4480-97b6-1742f885cdcf rootwait log_buf_len=16M panic=0 panic_print=0xff console=tty0 fbcon=nodefer loglevel=5 vt.global_cursor_default=0 ath10k_core.fw_diag_log=1 ath10k_core.debug_mask=0x202a
	initrd	($root)/EFI/crux/initramfs.cpio.gz
	devicetree ($root)/EFI/crux/sm8150-xiaomi-crux-73.dtb
}

# ---- 7.3 原生（先用它测试）----
menuentry "crux Linux (mainline 7.3 native)" --id crux73old {
	search --no-floppy --file --set=root /EFI/crux/Image73
	# [crux] 交接：把显示电路按内核那套先做好，再交给内核
	set crux_replay=2
	insmod ($root)/EFI/crux/cruxdisplay.mod

	crux_display_init ($root)/EFI/crux/sm8150-xiaomi-crux-73.dtb
	linux	($root)/EFI/crux/Image73 rw cfg80211.ieee80211_regdom=CN clk_ignore_unused pd_ignore_unused deferred_probe_timeout=-1 printk.time=1 root=UUID=ed36cd26-63e2-4480-97b6-1742f885cdcf rootwait log_buf_len=16M panic=0 panic_print=0xff console=tty0 fbcon=nodefer loglevel=5 vt.global_cursor_default=0 ath10k_core.fw_diag_log=1 ath10k_core.debug_mask=0x202a
	initrd	($root)/EFI/crux/initramfs.cpio.gz
	devicetree ($root)/EFI/crux/sm8150-xiaomi-crux-73.dtb
}

# ---- 6.17（旧的，保留作为回退）----
menuentry "crux Linux (mainline 6.17)" --id crux {
	search --no-floppy --file --set=root /EFI/crux/Image
	linux	($root)/EFI/crux/Image rw clk_ignore_unused pd_ignore_unused deferred_probe_timeout=-1 printk.time=1 root=UUID=a9c4c05b-8e00-49d7-b401-27d1761d8ffe rootwait log_buf_len=16M panic=0 panic_print=0xff console=tty0 fbcon=nodefer loglevel=5 vt.global_cursor_default=0 ath10k_core.fw_diag_log=1 ath10k_core.debug_mask=0x202a mhi_sahara_sdx50m.sahara_rx_kb=32 mhi_sahara_sdx50m.efs_dump_enable=1
	initrd	($root)/EFI/crux/initramfs.cpio.gz
	devicetree ($root)/EFI/crux/sm8150-xiaomi-crux.dtb
}

menuentry "Windows (WoA, 链式引导 bootmgfw.efi)" --id windows {
	search --no-floppy --file --set=root /EFI/Microsoft/Boot/bootmgfw.efi
	if [ -f ($root)/EFI/Microsoft/Boot/bootmgfw.efi ]; then
		chainloader ($root)/EFI/Microsoft/Boot/bootmgfw.efi
		boot
	else
		echo "没找到 /EFI/Microsoft/Boot/bootmgfw.efi"
		sleep 3
	fi
}
