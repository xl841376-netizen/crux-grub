# [crux] 编进 BOOTAA64.EFI 的内嵌配置（改这个要重做 .efi）
# cruxdisplay 为内建模块，insmod 幂等
insmod cruxdisplay
set memprefix=$prefix
search --no-floppy --file --set=root /EFI/crux/grub.cfg
if [ -f ($root)/EFI/crux/grub.cfg ]; then
	set prefix=($root)/EFI/crux
	source ($root)/EFI/crux/grub.cfg
else
	echo "crux-grub: ESP 上没有 /EFI/crux/grub.cfg，改用镜像内嵌菜单"
	source ($memprefix)/crux-menu.cfg
fi
